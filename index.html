<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="GymLog">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GymLog — дневник тренировок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0f11;--card:#17191d;--card2:#1f2227;--line:#2a2e35;--text:#eef0f2;--muted:#8b919a;
  --acc:#c6f432;--acc-ink:#1a1f05;--hot:#ff6b4a;--blue:#5cc8ff;--violet:#b18cff;--warn:#ffc94a;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:Unbounded,Manrope,sans-serif;font-weight:700;margin:0;letter-spacing:-.01em}
h1{font-size:24px}h2{font-size:17px}h3{font-size:14px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.logo{font-family:Unbounded;font-size:20px;font-weight:700;padding:0 10px 18px;display:flex;align-items:center;gap:8px}
.logo b{background:var(--acc);color:var(--acc-ink);border-radius:8px;padding:2px 7px;font-size:14px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:600;cursor:pointer}
.nav a:hover{background:var(--card);color:var(--text)}
.nav a.on{background:var(--card2);color:var(--text)}
.nav a.on .ic{color:var(--acc)}
.ic{width:20px;height:20px;flex:none}
.side .foot{margin-top:auto;padding:10px;font-size:12px;color:var(--muted)}
main{padding:28px 32px 100px;max-width:1180px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.top p{margin:4px 0 0;color:var(--muted)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--acc)}.sync.busy i{background:var(--warn)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.span2{grid-column:span 2}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.big{font-family:Unbounded;font-size:30px;font-weight:700;line-height:1.1}
.btn{border:0;background:var(--acc);color:var(--acc-ink);font-weight:700;padding:10px 16px;border-radius:12px;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.danger{background:transparent;color:var(--hot);border:1px solid #4a2a24}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px 6px;border-radius:8px}
.x:hover{color:var(--hot);background:#2a1d1a}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:70px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:600}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row>*{flex:1;min-width:80px}
.row>.nf{flex:none}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--card2);color:var(--muted)}
.pill{text-decoration:none}
.pill.acc{background:rgba(198,244,50,.13);color:var(--acc)}
.pill.hot{background:rgba(255,107,74,.13);color:var(--hot)}
.empty{color:var(--muted);font-size:13px;padding:14px 0;text-align:center}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:12px;width:max-content;max-width:100%;overflow:auto}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:9px;color:var(--muted);font-weight:700;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--card2);color:var(--text)}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px}
.macro{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;font-size:13px;margin:7px 0}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.water{display:flex;gap:6px;flex-wrap:wrap}
.water button{width:34px;height:42px;border-radius:9px;border:1px solid var(--line);background:var(--bg);cursor:pointer;position:relative;overflow:hidden}
.water button.on{background:linear-gradient(to top,var(--blue) 75%,transparent 75%);border-color:var(--blue)}
.daynav{display:flex;align-items:center;gap:8px}
.daynav b{min-width:120px;text-align:center}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:170px;display:flex;flex-direction:column;gap:8px}
.day.today{border-color:var(--acc)}
.day .dh{display:flex;justify-content:space-between;align-items:baseline}
.slot{background:var(--card2);border-radius:10px;padding:8px 9px;font-size:13px;border-left:3px solid var(--acc);position:relative}
.slot .x{position:absolute;right:2px;top:2px;font-size:14px}
.slot.done{opacity:.6}
.slot .t{font-weight:800;font-size:12px;color:var(--muted)}
.add-slot{margin-top:auto;border:1px dashed var(--line);background:none;border-radius:10px;padding:7px;color:var(--muted);cursor:pointer;font-weight:600}
.add-slot:hover{color:var(--acc);border-color:var(--acc)}
.scale{display:flex;gap:6px}
.scale button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 0;cursor:pointer;font-size:20px}
.scale.txt button{font-size:13px;font-weight:700}
.scale button.on{border-color:var(--acc);background:rgba(198,244,50,.1)}
.ex{background:var(--card2);border-radius:12px;padding:12px;margin-bottom:10px}
.ex .sets{display:grid;grid-template-columns:28px 1fr 1fr 30px;gap:6px;align-items:center;margin-top:8px}
.ex .sets .n{color:var(--muted);font-size:12px;text-align:center}
.pex{display:grid;grid-template-columns:1fr 64px 64px 74px 30px;gap:6px;align-items:center;margin-bottom:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 11px;font-size:12px;cursor:pointer;font-weight:600}
.chip:hover{border-color:var(--acc);color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:12px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;padding:40px 14px;z-index:50;overflow:auto}
.modal-bg.open{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:20px;width:100%;max-width:620px;padding:22px}
.modal .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.foot-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.stack>*+*{margin-top:12px}
svg text{fill:var(--muted);font-size:11px;font-family:Manrope}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--acc);color:var(--acc-ink);font-weight:700;padding:10px 18px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%)}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.stat{display:flex;flex-direction:column;gap:2px}
@media (max-width:980px){
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .week{grid-template-columns:repeat(2,minmax(0,1fr))}
}
.mbar,.fab-i,.add-m{display:none}
@media (max-width:760px){
  html,body{font-size:15px;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
  .app{grid-template-columns:1fr;min-height:100dvh}
  main{padding:12px 14px calc(96px + env(safe-area-inset-bottom));min-width:0}
  /* верхняя панель */
  .mbar{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:35;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:rgba(14,15,17,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .mbar .logo{display:flex;padding:0;font-size:17px}
  .mbar .r{display:flex;align-items:center;gap:6px}
  .mbar .sync span{display:none}
  .mbar .sync{padding:8px}
  .icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer}
  /* нижняя навигация */
  nav.side{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);background:rgba(14,15,17,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:40;justify-content:space-around}
  nav.side>.logo,.side .foot{display:none}
  .nav{display:contents}
  .nav a{flex-direction:column;gap:3px;font-size:10.5px;padding:6px 2px;flex:1;text-align:center;border-radius:12px;min-width:0}
  .nav a .ic{width:22px;height:22px}
  .nav a.on{background:none}
  .nav a.on .ic{background:rgba(198,244,50,.15);border-radius:10px;padding:3px;width:40px;height:28px}
  .nav a .lf{display:none}
  .nav a .ls{display:block!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  /* заголовок страницы */
  .top{margin:6px 0 14px;align-items:center;flex-wrap:nowrap}
  h1{font-size:21px}
  .top p{font-size:13px}
  .daynav b{min-width:auto;font-size:13px}
  /* плавающая кнопка */
  .fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:38;width:58px;height:58px;padding:0;border-radius:20px;box-shadow:0 8px 24px rgba(198,244,50,.28),0 2px 6px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
  .fab .fab-t{display:none}
  .fab .fab-i{display:block;font-size:30px;font-weight:500;line-height:1}
  /* сетки и карточки */
  .grid{gap:12px}
  .g2,.g3{grid-template-columns:1fr}
  .g3.keep3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .span2{grid-column:auto}
  .card{padding:15px;border-radius:18px}
  .card .hd{flex-wrap:wrap;margin-bottom:12px}
  .big{font-size:24px}
  .ring{width:130px;height:130px}
  .ring svg{width:130px;height:130px}
  .today-cal{flex-wrap:nowrap!important;gap:16px!important}
  .today-cal>div:last-child{min-width:0!important;flex:1}
  .macro{grid-template-columns:62px 1fr auto;gap:8px;font-size:12px}
  .water button{width:calc((100% - 42px)/8);min-width:28px;height:44px}
  /* формы: 16px, чтобы iOS не увеличивал страницу */
  input,select,textarea{font-size:16px;padding:10px 11px}
  .row{gap:8px}
  .row>*{min-width:0}
  .row4{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))}
  .row4>.btn{grid-column:1/-1}
  .row2{display:grid!important;grid-template-columns:1fr 1fr}
  .sshead{display:grid!important;grid-template-columns:1fr 92px}
  .sshead>:first-child{grid-column:1/-1}
  .g3.keep2{grid-template-columns:1fr 1fr}
  .grid>*,.card{min-width:0}
  .fhead{display:grid!important;grid-template-columns:1fr 122px}
  .top .pill{display:none}
  .add-slot{display:none}
  .dh .add-m{display:inline-flex}
  .day .dh b{font-size:15px}
  .nav a{font-size:10px}
  .btn{padding:12px 16px}
  .btn.sm{padding:8px 12px}
  .x{font-size:20px;padding:6px 9px}
  .tabs{width:100%}
  .tabs button{flex:1;padding:9px 12px}
  .card .hd .tabs{width:100%}
  .card .hd .tabs button{flex:none}
  .tbl{overflow-x:auto;margin:0 -15px;padding:0 15px}
  .tbl table{min-width:420px}
  /* расписание — списком */
  .week{grid-template-columns:1fr;gap:10px}
  .week.strip{grid-template-columns:repeat(7,minmax(0,1fr))!important;gap:5px!important}
  .day{min-height:0;padding:12px 14px}
  .day .dh{align-items:center}
  .add-slot{margin-top:2px;padding:10px}
  /* модальные окна — нижний лист на весь экран */
  .modal-bg{padding:0;align-items:flex-end}
  .modal-bg.open .modal{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  .modal{max-width:none;border-radius:22px 22px 0 0;border-bottom:0;max-height:94dvh;overflow-y:auto;overscroll-behavior:contain;padding:0 16px}
  .modal .hd{position:sticky;top:0;z-index:3;background:var(--card);margin:0 -16px 12px;padding:22px 16px 12px;border-bottom:1px solid var(--line)}
  .modal .hd::before{content:"";position:absolute;top:8px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:4px;background:#3a3f47}
  .foot-btns{position:sticky;bottom:0;z-index:3;background:var(--card);margin:16px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .foot-btns .btn{flex:1}
  .foot-btns .btn.danger{flex:none}
  .ex{padding:12px 10px}
  .exh{gap:6px}
  .ex .sets{grid-template-columns:22px 1fr 1fr 34px;gap:6px}
  .pex{grid-template-columns:1fr 48px 48px 58px 30px;gap:5px}
  .pex input{padding:10px 6px;text-align:center}
  .pex input.e-n{text-align:left}
  .scale button{padding:10px 0;font-size:22px}
  .scale.txt button{font-size:12px;padding:11px 0}
  .toast{bottom:calc(150px + env(safe-area-inset-bottom));max-width:90vw;text-align:center}
  .mood14{gap:3px!important}
  .mood14>div{font-size:13px!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="mbar"><div class="logo">GymLog <b>FIT</b></div><div class="r"><button class="btn sm install-btn" data-act="install" style="display:none">Установить</button><div class="sync" id="msync"><i></i><span></span></div><button class="icon-btn" data-act="settings" aria-label="Данные и экспорт"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div></header>
  <nav class="side">
    <div class="logo">GymLog <b>FIT</b></div>
    <div class="nav" id="nav"></div>
    <div class="foot"><div class="sync" id="sync"><i></i><span>Загрузка…</span></div>
      <button class="btn sm install-btn" data-act="install" style="display:none;margin-top:10px">Установить приложение</button>
      <div style="margin-top:10px"><a href="#" data-act="settings" style="color:var(--muted)">⚙ Данные и экспорт</a></div></div>
  </nav>
  <main id="main"></main>
</div>
<div class="modal-bg" id="mbg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- утилиты ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ds(new Date());
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ds(d)};
const wd=s=>(parseD(s).getDay()+6)%7;
const DAYS=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const DAYS_F=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const fmtD=s=>{const d=parseD(s);return d.getDate()+' '+MON[d.getMonth()]};
const fmtShort=s=>{const d=parseD(s);return pad(d.getDate())+'.'+pad(d.getMonth()+1)};
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
const r1=n=>Math.round(n*10)/10;
const sum=(a,f)=>a.reduce((s,x)=>s+(f?f(x):x)||0,0);
const weekStart=s=>addDays(s,-wd(s));
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1800)}

/* ---------- состояние ---------- */
const KEYS=['profile','food','plans','sessions','schedule','body','mood'];
function defaults(){return{
  profile:{sex:'f',age:20,height:165,weight:60,activity:1.55,goal:'keep',kcal:2000,p:110,f:55,c:262},
  food:{days:{},water:{},waterGoal:8},
  plans:[
    {id:'p1',name:'Ноги и ягодицы',color:'#c6f432',exercises:[
      {name:'Приседания со штангой',sets:4,reps:10,weight:40},{name:'Румынская тяга',sets:3,reps:12,weight:30},
      {name:'Ягодичный мост',sets:4,reps:12,weight:50},{name:'Выпады с гантелями',sets:3,reps:10,weight:8}]},
    {id:'p2',name:'Верх тела',color:'#5cc8ff',exercises:[
      {name:'Жим гантелей лёжа',sets:4,reps:10,weight:10},{name:'Тяга верхнего блока',sets:4,reps:12,weight:35},
      {name:'Жим гантелей сидя',sets:3,reps:10,weight:7},{name:'Планка (сек)',sets:3,reps:45,weight:0}]}
  ],

/* облачное сохранение (личные данные пользователя) */
let DB=null,UID=null,cloud=false,flushing=false,dirty=new Set(),flushT=null;
function setSync(cls,txt){document.querySelectorAll('.sync').forEach(el=>{el.className='sync '+cls;el.title=txt;el.querySelector('span').textContent=txt})}
function save(...keys){keys.forEach(k=>dirty.add(k));lsSave();if(cloud){setSync('busy','Сохраняю…');clearTimeout(flushT);flushT=setTimeout(flush,700)}}
async function flush(){
  if(!cloud)return;
  if(flushing){clearTimeout(flushT);flushT=setTimeout(flush,500);return}
  flushing=true;
  try{
    while(dirty.size){
      const k=[...dirty][0];dirty.delete(k);
      try{await DB.doc('data/users/'+UID+'/'+k).set({v:JSON.parse(JSON.stringify(S[k]))})}
      catch(e){
        if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{await DB.doc('data/users/'+UID+'/'+k).set({v:S[k]})}catch(e2){dirty.add(k);throw e2}}
        else{dirty.add(k);throw e}
      }
    }
    setSync('ok','Синхронизировано');
  }catch(e){
    if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')){cloud=false;setSync('','Сохранено на этом устройстве')}
    else if(e&&e.code==='quota_exceeded'){setSync('','Хранилище заполнено')}
    else setSync('','Нет связи — сохранено локально');
  }finally{flushing=false}
}
async function initCloud(){
  const timer=setTimeout(()=>{if(!cloud)setSync('','Сохранено на этом устройстве')},10000);
  try{
    if(!window.claude||!claude.use){clearTimeout(timer);setSync('','Сохранено на этом устройстве');return}
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user){clearTimeout(timer);setSync('','Сохранено на этом устройстве');return}
    const id=await user.id();
    if(!id){clearTimeout(timer);setSync('','Сохранено на этом устройстве');return}
    DB=db;UID=id;
    const snaps=await Promise.all(KEYS.map(k=>db.doc('data/users/'+id+'/'+k).get()));
    clearTimeout(timer);
    cloud=true;
    const any=snaps.some(s=>s.exists);
    if(any){snaps.forEach((s,i)=>{if(s.exists){const d=s.data();if(d&&d.v!=null)S[KEYS[i]]=JSON.parse(JSON.stringify(d.v))}});lsSave();render();setSync('ok','Синхронизировано')}
    else{save(...KEYS)}
  }catch(e){clearTimeout(timer);cloud=false;setSync('','Сохранено на этом устройстве')}
}

/* ---------- вычисления ---------- */
const ACT=[[1.2,'Минимальная (сидячая работа)'],[1.375,'Лёгкая (1–3 трен./нед)'],[1.55,'Средняя (3–5 трен./нед)'],[1.725,'Высокая (6–7 трен./нед)'],[1.9,'Очень высокая (2 трен./день)']];
const GOALS={lose:['Похудение',0.85],keep:['Поддержание',1],gain:['Набор массы',1.1]};
function calcNorm(p){
  const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==='m'?5:-161);
  const kcal=Math.round(bmr*p.activity*GOALS[p.goal][1]/10)*10;
  const prot=Math.round(p.weight*(p.goal==='lose'?2:1.8));
  const fat=Math.round(p.weight*0.9);
  const carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  return{bmr:Math.round(bmr),kcal,p:prot,f:fat,c:carb};
}
const dayFood=d=>S.food.days[d]||[];
const dayTot=d=>{const a=dayFood(d);return{kcal:sum(a,x=>x.kcal),p:sum(a,x=>x.p),f:sum(a,x=>x.f),c:sum(a,x=>x.c)}};
const sessVolume=s=>sum(s.items,it=>sum(it.sets,st=>(st.w||0)*(st.r||0)));
const sessSets=s=>sum(s.items,it=>it.sets.length);
const planById=id=>S.plans.find(p=>p.id===id);
const e1rm=(w,r)=>r<=1?w:w*(1+r/30);
function exerciseStats(){
  const m={};
  [...S.sessions].sort((a,b)=>a.date<b.date?-1:1).forEach(s=>s.items.forEach(it=>{
    const key=it.name.trim().toLowerCase();if(!key)return;
    const o=m[key]||(m[key]={name:it.name.trim(),best:0,bestR:0,e1:0,hist:[]});
    let mx=0;it.sets.forEach(st=>{if((st.w||0)>mx)mx=st.w||0;if((st.w||0)>o.best||((st.w||0)===o.best&&(st.r||0)>o.bestR)){o.best=st.w||0;o.bestR=st.r||0}const e=e1rm(st.w||0,st.r||0);if(e>o.e1)o.e1=e});
    o.hist.push({x:s.date,y:mx});
  }));
  return Object.values(m).sort((a,b)=>b.hist.length-a.hist.length);
}

/* ---------- графики ---------- */
const MQ=matchMedia('(max-width:760px)');MQ.addEventListener&&MQ.addEventListener('change',()=>render());
function lineChart(pts,{h=190,color='var(--acc)',unit='',fill=true,W=MQ.matches?360:640}={}){
  if(MQ.matches&&W>360){h=Math.round(h*360/W);W=360}
  if(pts.length<2)return '<div class="empty">Добавь минимум две записи — появится график</div>';
  const H=h,pl=42,pr=14,pt=14,pb=26;
  let mn=Math.min(...pts.map(p=>p.y)),mx=Math.max(...pts.map(p=>p.y));
  if(mn===mx){mn-=1;mx+=1}const padv=(mx-mn)*.12;mn-=padv;mx+=padv;
  const X=i=>pl+i*(W-pl-pr)/(pts.length-1),Y=v=>pt+(mx-v)/(mx-mn)*(H-pt-pb);
  let g='';for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3,y=Y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#2a2e35"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${r1(v)}</text>`}
  const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const area=d+` L${X(pts.length-1)} ${H-pb} L${pl} ${H-pb} Z`;
  const idx=[...new Set([0,Math.floor((pts.length-1)/2),pts.length-1])];
  const xl=idx.map(i=>`<text x="${X(i)}" y="${H-6}" text-anchor="${i===0?'start':i===pts.length-1?'end':'middle'}">${esc(pts[i].lx||fmtShort(pts[i].x))}</text>`).join('');
  const dots=pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="3.5" fill="${color}"><title>${esc(pts[i].lx||fmtD(p.x))}: ${r1(p.y)}${unit}</title></circle>`).join('');
  const gid='g'+newId();
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".25"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${g}${fill?`<path d="${area}" fill="url(#${gid})"/>`:''}<path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xl}</svg>`;
}
function barChart(bars,{h=190,target=null,W=380}={}){
  const H=h,pl=42,pr=10,pt=14,pb=26;
  const mx=Math.max(target||0,...bars.map(b=>b.y),10)*1.15;
  const bw=(W-pl-pr)/bars.length;const Y=v=>pt+(mx-v)/mx*(H-pt-pb);
  let s='';for(let i=0;i<=3;i++){const v=mx*i/3,y=Y(v);s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#2a2e35"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${Math.round(v)}</text>`}
  bars.forEach((b,i)=>{const x=pl+i*bw+bw*.2,w=bw*.6,y=Y(b.y);const over=target&&b.y>target*1.05;
    s+=`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(0,H-pb-y)}" rx="6" fill="${b.y?(over?'var(--hot)':'var(--acc)'):'#2a2e35'}"><title>${esc(b.lx)}: ${Math.round(b.y)}</title></rect><text x="${x+w/2}" y="${H-6}" text-anchor="middle">${esc(b.lx)}</text>`});
  if(target){const y=Y(target);s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--blue)" stroke-dasharray="5 5"/><text x="${W-pr}" y="${y-5}" text-anchor="end" style="fill:var(--blue)">норма ${target}</text>`}
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${s}</svg>`;
}
function ring(val,max,size=150,color='var(--acc)'){
  const r=size/2-11,c=2*Math.PI*r,p=Math.min(1,max?val/max:0);
  const col=val>max*1.05?'var(--hot)':color;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#2a2e35" stroke-width="12"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;
}

function pageSchedule(){
  const d=today(),ws=weekStart(d);
  return header('Расписание','Недельный план тренировок — повторяется каждую неделю',`<span class="pill">Неделя ${fmtD(ws)} — ${fmtD(addDays(ws,6))}</span>`)+
  `<div class="week">${DAYS_F.map((n,i)=>{const day=addDays(ws,i);const slots=(S.schedule.days[i]||[]).slice().sort((a,b)=>(a.time||'').localeCompare(b.time||''));const done=S.sessions.filter(s=>s.date===day);
    return `<div class="day ${day===d?'today':''}"><div class="dh"><b title="${n}">${DAYS[i]}</b><span style="display:flex;align-items:center;gap:8px"><span class="tiny muted">${fmtShort(day)}</span><button class="btn sm ghost add-m" data-act="addSlot" data-d="${i}">+ Добавить</button></span></div>
    ${slots.map(s=>{const p=planById(s.planId);const ok=done.some(x=>x.planId&&x.planId===s.planId)||(!s.planId&&done.length);return `<div class="slot ${ok?'done':''}" style="border-left-color:${esc(p?p.color:'var(--violet)')}"><div class="t">${esc(s.time||'')}${ok?' ✓':''}</div><div><b>${esc(p?p.name:s.title||'Тренировка')}</b></div>${s.note?`<div class="tiny muted">${esc(s.note)}</div>`:''}<button class="x" data-act="delSlot" data-d="${i}" data-id="${s.id}">×</button></div>`}).join('')}
    ${!slots.length?'<div class="tiny muted">Отдых</div>':''}
    <button class="add-slot" data-act="addSlot" data-d="${i}">+ Добавить</button></div>`}).join('')}</div>

    <div class="small">Запланировано: <b>${sum(S.schedule.days,a=>a.length)}</b> · Выполнено: <b style="color:var(--acc)">${S.sessions.filter(s=>s.date>=ws&&s.date<=addDays(ws,6)).length}</b></div></div>`;
}

const BODY_M=[['weight','Вес','кг'],['waist','Талия','см'],['chest','Грудь','см'],['hips','Бёдра','см'],['arm','Бицепс','см'],['leg','Бедро','см'],['fat','% жира','%']];

      ${lineChart(pts,{unit:' '+mm[2]})}
      ${first&&last&&first!==last?`<div class="chips" style="margin-top:12px">${BODY_M.filter(([k])=>first[k]!=null&&last[k]!=null).map(([k,l,u])=>{const df=r1(last[k]-first[k]);return `<span class="pill ${df<0?'acc':df>0?'hot':''}">${l}: ${df>0?'+':''}${df} ${u}</span>`}).join('')}</div>`:''}

function slotModal(day){
  openModal(mhead('Добавить в расписание: '+DAYS_F[day])+`
  <div class="stack">
    <label class="f">Тренировка<select id="sl-plan"><option value="">Другое (своё название)</option>${S.plans.map((p,i)=>`<option value="${p.id}" ${i===0?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>
    <label class="f">Своё название (если не из плана)<input id="sl-title" placeholder="Кардио, растяжка, бассейн…"></label>
    <div class="row"><label class="f">Время<input type="time" id="sl-time" value="18:00"></label><label class="f" style="flex:2">Заметка<input id="sl-note" placeholder="Зал на Ленина / с тренером"></label></div>
  </div>
  <div class="foot-btns"><button class="btn ghost" data-act="close">Отмена</button><button class="btn" data-act="slSave" data-d="${day}">Добавить</button></div>`);
}
function bodyModal(){
  const last=[...S.body].sort((a,b)=>a.date<b.date?1:-1)[0]||{};
  openModal(mhead('Новый замер')+`
  <form data-form="body" class="stack">
    <label class="f">Дата<input type="date" name="date" value="${today()}"></label>
    <div class="grid g3 keep2" style="gap:10px">${BODY_M.map(([k,l,u])=>`<label class="f">${l}, ${u}<input name="${k}" inputmode="decimal" placeholder="${last[k]??''}"></label>`).join('')}</div>
    <div class="tiny muted">Заполни только то, что измеряешь. Серым — прошлые значения.</div>
    <div class="foot-btns"><button type="button" class="btn ghost" data-act="close">Отмена</button><button class="btn">Сохранить</button></div>
  </form>`);
}
function quickFoodModal(){
  openModal(mhead('Добавить еду — сегодня')+`
  <form data-form="foodQuick" class="stack">
    <div class="row fhead"><label class="f" style="flex:3">Блюдо<input name="name" required></label><label class="f">Приём<select name="meal">${MEALS.map(m=>`<option>${m}</option>`).join('')}</select></label></div>
    <div class="row row4"><label class="f">Ккал<input name="kcal" inputmode="decimal" required></label><label class="f">Б<input name="p" inputmode="decimal"></label><label class="f">Ж<input name="f" inputmode="decimal"></label><label class="f">У<input name="c" inputmode="decimal"></label></div>
    <div class="foot-btns"><button type="button" class="btn ghost" data-act="close">Отмена</button><button class="btn">Добавить</button></div>
  </form>`);
}
function settingsModal(){
  openModal(mhead('Данные')+`
  <div class="stack">
    <div class="small">Данные хранятся только на этом телефоне. Время от времени делай резервную копию — она пригодится при смене телефона или переустановке.</div>
    <div class="small muted">Резервная копия: скопируй JSON и сохрани где-нибудь. Чтобы восстановить — вставь его в поле ниже.</div>
    <div class="row"><button class="btn ghost nf" data-act="downloadJson">Скачать файл копии</button><button class="btn ghost nf" data-act="copyJson">Скопировать JSON</button></div>
    <textarea id="imp" placeholder="Вставь сюда JSON для восстановления" style="min-height:110px"></textarea>
    <div class="row"><button class="btn nf" data-act="importJson">Восстановить из JSON</button><button class="btn danger nf" data-act="resetAsk">Очистить все данные</button></div>
    <div id="resetBox"></div>
  </div>`);
}

/* ---------- действия ---------- */
const MAIN=$('#main');
function render(){
  $('#nav').innerHTML=PAGES.map(([k,l,s])=>`<a href="#${k}" class="${page===k?'on':''}">${icon(k)}<span class="lf">${l}</span><span class="ls" style="display:none">${s}</span></a>`).join('');
  MAIN.innerHTML={today:pageToday,food:pageFood,train:pageTrain,schedule:pageSchedule,progress:pageProgress,mood:pageMood}[page]();
}
function addFood(fd,date){
  const f={id:newId(),name:fd.get('name').trim(),meal:fd.get('meal')||'Перекус',kcal:num(fd.get('kcal'))||0,p:num(fd.get('p'))||0,f:num(fd.get('f'))||0,c:num(fd.get('c'))||0};
  if(!f.name)return;(S.food.days[date]||(S.food.days[date]=[])).push(f);save('food');toast('Добавлено: '+f.name);
}
document.addEventListener('submit',e=>{
  const form=e.target.closest('[data-form]');if(!form)return;e.preventDefault();
  const fd=new FormData(form),k=form.dataset.form;
  if(k==='food'){addFood(fd,UI.foodDate);render();setTimeout(()=>{const i=document.querySelector('[data-form=food] [name=name]');i&&i.focus()},0)}
  else if(k==='foodQuick'){addFood(fd,today());closeModal();render()}
  else if(k==='norm'){
    const P=S.profile;P.sex=fd.get('sex');P.age=num(fd.get('age'))||P.age;P.height=num(fd.get('height'))||P.height;P.weight=num(fd.get('weight'))||P.weight;P.activity=+fd.get('activity');P.goal=fd.get('goal');
    const n=calcNorm(P);Object.assign(P,{kcal:n.kcal,p:n.p,f:n.f,c:n.c});save('profile');render();toast('Норма: '+n.kcal+' ккал');
  }
  else if(k==='normManual'){const P=S.profile;['kcal','p','f','c'].forEach(x=>{const v=num(fd.get(x));if(v!=null)P[x]=Math.round(v)});save('profile');render();toast('Норма обновлена')}
  else if(k==='body'){
    const b={id:newId(),date:fd.get('date')||today()};let any=false;
    BODY_M.forEach(([m])=>{const v=num(fd.get(m));if(v!=null){b[m]=v;any=true}});
    if(!any){toast('Заполни хотя бы одно поле');return}
    S.body.push(b);if(b.weight!=null){const latest=[...S.body].sort((a,c)=>a.date<c.date?1:-1).find(x=>x.weight!=null);if(latest)S.profile.weight=latest.weight;save('profile')}
    save('body');closeModal();render();toast('Замер сохранён');
  }
  else if(k==='mood'){
    const m={};['mood','energy','sore'].forEach(s=>{const b=form.querySelector(`[data-scale="${s}"] .on`);if(b)m[s]=+b.dataset.v});
    ['sleep','pulse','stress'].forEach(s=>{const v=num(fd.get(s));if(v!=null)m[s]=v});
    const note=fd.get('note').trim();if(note)m.note=note;
    if(!Object.keys(m).length){toast('Отметь хотя бы что-нибудь');return}
    S.mood[UI.moodDate]=m;save('mood');render();toast('Самочувствие записано');
  }
});
document.addEventListener('input',e=>{
  const f=e.target.closest('[data-form="norm"]');
  if(f){const fd=new FormData(f);const P={sex:fd.get('sex'),age:num(fd.get('age'))||0,height:num(fd.get('height'))||0,weight:num(fd.get('weight'))||0,activity:+fd.get('activity'),goal:fd.get('goal')};$('#normPreview').innerHTML=normPreview(calcNorm(P))}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.act==='exSel'){UI.exSel=t.value;render()}
  if(t.dataset.act==='ssPlan'){const nd=sessionFromPlan(t.value);nd.date=$('#ss-date').value||today();draft=nd;sessionModal()}
  const f=t.closest('[data-form="norm"]');if(f)f.dispatchEvent(new Event('input',{bubbles:true}));
});
document.addEventListener('click',e=>{
  const sc=e.target.closest('.scale button');
  if(sc&&!sc.dataset.act){e.preventDefault();sc.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===sc&&!b.classList.contains('on')));return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;if(a==='exSel'||a==='ssPlan')return;
  if(el.tagName==='A'&&a!=='exChart')e.preventDefault();
  const id=el.dataset.id;
  switch(a){
    case 'close':closeModal();break;
    case 'install':if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null})}break;
    case 'downloadJson':{const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a2=document.createElement('a');a2.href=URL.createObjectURL(blob);a2.download='gymlog-backup-'+today()+'.json';a2.click();setTimeout(()=>URL.revokeObjectURL(a2.href),2000);break}
    case 'settings':settingsModal();break;
    case 'water':{const d=today(),n=+el.dataset.n;S.food.water[d]=(S.food.water[d]===n)?n-1:n;save('food');render();break}
    case 'quickFood':quickFoodModal();break;
    case 'quickMood':{const d=today();S.mood[d]=Object.assign(S.mood[d]||{},{mood:+el.dataset.v});save('mood');render();toast('Записано. Подробнее — в «Самочувствие»');break}
    case 'fday':UI.foodDate=addDays(UI.foodDate,+el.dataset.n);render();break;
    case 'mday':UI.moodDate=addDays(UI.moodDate,+el.dataset.n);render();break;
    case 'mgo':UI.moodDate=el.dataset.d;render();window.scrollTo(0,0);break;
    case 'refood':{
      const recent=[];const seen=new Set();
      Object.keys(S.food.days).sort().reverse().forEach(k=>S.food.days[k].slice().reverse().forEach(f=>{const key=f.name.toLowerCase();if(!seen.has(key)&&recent.length<10){seen.add(key);recent.push(f)}}));
      const f=recent[+el.dataset.i];if(f){(S.food.days[UI.foodDate]||(S.food.days[UI.foodDate]=[])).push({...f,id:newId()});save('food');render();toast('Добавлено: '+f.name)}break}
    case 'delFood':{const l=S.food.days[UI.foodDate]||[];S.food.days[UI.foodDate]=l.filter(f=>f.id!==id);save('food');render();break}
    case 'ttab':UI.trainTab=el.dataset.t;render();break;
    case 'editPlan':{const p=id&&planById(id);draft=p?JSON.parse(JSON.stringify(p)):{id:null,name:'',color:'#c6f432',exercises:[{name:'',sets:3,reps:10,weight:''}]};planModal();break}
    case 'plColor':readPlan();draft.color=el.dataset.c;planModal();break;
    case 'plAddEx':readPlan();draft.exercises.push({name:'',sets:3,reps:10,weight:''});planModal();setTimeout(()=>{const l=document.querySelectorAll('#pl-ex .e-n');l[l.length-1].focus()},0);break;
    case 'plDelEx':readPlan();draft.exercises.splice(+el.dataset.i,1);planModal();break;
    case 'plSave':{readPlan();if(!draft.name.trim()){toast('Введи название плана');break}
      draft.exercises=draft.exercises.filter(x=>x.name.trim());
      if(draft.id){const i=S.plans.findIndex(p=>p.id===draft.id);S.plans[i]=draft}else{draft.id=newId();S.plans.push(draft)}
      save('plans');closeModal();render();toast('План сохранён');break}
    case 'plDel':{
      if(el.dataset.sure){S.plans=S.plans.filter(p=>p.id!==draft.id);S.schedule.days=S.schedule.days.map(d=>d.filter(s=>s.planId!==draft.id));save('plans','schedule');closeModal();render();toast('План удалён')}
      else{el.dataset.sure='1';el.textContent='Точно удалить?'}break}
    case 'newSession':draft=sessionFromPlan(el.dataset.plan);sessionModal();break;
    case 'editSession':e.preventDefault();{const s=S.sessions.find(x=>x.id===id);if(s){draft=JSON.parse(JSON.stringify(s));sessionModal()}}break;
    case 'ssAddEx':readSession();draft.items.push({name:'',sets:[{w:'',r:''}]});sessionModal();break;
    case 'ssDelEx':readSession();draft.items.splice(+el.dataset.i,1);sessionModal();break;
    case 'ssAddSet':{readSession();const it=draft.items[+el.dataset.i];const l=it.sets[it.sets.length-1]||{w:'',r:''};it.sets.push({...l});sessionModal();break}
    case 'ssDelSet':readSession();draft.items[+el.dataset.i].sets.splice(+el.dataset.j,1);sessionModal();break;
    case 'ssSave':{readSession();
      draft.items=draft.items.filter(it=>it.name.trim()).map(it=>({name:it.name.trim(),sets:it.sets.filter(s=>s.w!=null||s.r!=null)}));
      if(!draft.items.length){toast('Добавь хотя бы одно упражнение');break}
      if(!draft.name.trim())draft.name='Тренировка';
      if(draft.id){const i=S.sessions.findIndex(x=>x.id===draft.id);S.sessions[i]=draft}else{draft.id=newId();S.sessions.push(draft)}
      save('sessions');closeModal();render();toast('Тренировка записана 💪');break}
    case 'delSession':e.preventDefault();
      if(el.dataset.sure){S.sessions=S.sessions.filter(s=>s.id!==id);save('sessions');render()}
      else{el.dataset.sure='1';el.textContent='удалить?';el.style.fontSize='12px';setTimeout(()=>{if(el.isConnected){delete el.dataset.sure;el.textContent='×';el.style.fontSize=''}},3000)}break;
    case 'addSlot':slotModal(+el.dataset.d);break;
    case 'slSave':{const d=+el.dataset.d;const planId=$('#sl-plan').value||null;const title=$('#sl-title').value.trim();
      if(!planId&&!title){toast('Выбери план или введи название');break}
      S.schedule.days[d].push({id:newId(),planId,title,time:$('#sl-time').value,note:$('#sl-note').value.trim()});save('schedule');closeModal();render();break}
    case 'delSlot':S.schedule.days[+el.dataset.d]=S.schedule.days[+el.dataset.d].filter(s=>s.id!==id);save('schedule');render();break;
    case 'newBody':bodyModal();break;
    case 'delBody':S.body=S.body.filter(b=>b.id!==id);save('body');render();break;
    case 'bm':UI.bodyMetric=el.dataset.m;render();break;
    case 'exChart':UI.exSel=el.dataset.n;break;
    case 'delMood':delete S.mood[UI.moodDate];save('mood');render();break;
    case 'copyJson':{const txt=JSON.stringify(S);navigator.clipboard.writeText(txt).then(()=>toast('Скопировано')).catch(()=>{$('#imp').value=txt;$('#imp').select();toast('Выдели и скопируй текст в поле')});break}
    case 'importJson':{try{const d=JSON.parse($('#imp').value);if(!d||typeof d!=='object'||!KEYS.some(k=>k in d))throw 0;const base=defaults();for(const k of KEYS)S[k]=d[k]??base[k];save(...KEYS);closeModal();render();toast('Данные восстановлены')}catch(_){toast('Не получилось прочитать JSON')}break}
    case 'resetAsk':$('#resetBox').innerHTML='<div class="row"><span class="small" style="color:var(--hot)">Все записи будут удалены безвозвратно.</span><button class="btn danger nf" data-act="resetDo">Да, очистить</button></div>';break;
    case 'resetDo':S=defaults();S.plans=[];save(...KEYS);closeModal();render();toast('Данные очищены');break;
  }
});

/* ---------- установка как приложение ---------- */
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;document.querySelectorAll('.install-btn').forEach(b=>b.style.display='')});
window.addEventListener('appinstalled',()=>{installEvt=null;document.querySelectorAll('.install-btn').forEach(b=>b.style.display='none');toast('Приложение установлено')});

/* ---------- старт ---------- */
lsLoad();
route();
setSync('busy','Подключение…');
initCloud();
</script>
</body>
</html>
